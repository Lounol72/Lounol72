<svg xmlns="http://www.w3.org/2000/svg" width="495" height="200" viewBox="0 0 495 200" role="img" aria-labelledby="title">
  <title id="title">Langages les plus utilisés</title>
  <style>
    text { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Sans-Serif; }
    .title { font-size: 18px; font-weight: 600; fill: #7aa2f7; }
    .label { font-size: 14px; fill: #a9b1d6; }
    .value { font-size: 14px; font-weight: 700; fill: #c0caf5; }
    .muted { font-size: 12px; fill: #565f89; }
    .big { font-size: 28px; font-weight: 700; fill: #c0caf5; }
  </style>
  <rect x="0.5" y="0.5" width="494" height="199" rx="6" fill="#1a1b27" stroke="#414868"/>
  <text x="25" y="35" class="title">Langages les plus utilisés</text>
  <clipPath id="bar"><rect x="25" y="55" width="445" height="8" rx="4"/></clipPath>
  <g clip-path="url(#bar)">
    <rect x="25.00" y="55" width="252.05" height="8" fill="#9aa5ce"/>
    <rect x="277.05" y="55" width="120.38" height="8" fill="#f34b7d"/>
    <rect x="397.43" y="55" width="32.93" height="8" fill="#b07219"/>
    <rect x="430.35" y="55" width="7.00" height="8" fill="#663399"/>
    <rect x="437.35" y="55" width="6.82" height="8" fill="#3178c6"/>
    <rect x="444.18" y="55" width="6.31" height="8" fill="#f1e05a"/>
    <rect x="450.48" y="55" width="19.52" height="8" fill="#565f89"/>
  </g>
  <g transform="translate(25, 92)">
    <circle cx="5" cy="-5" r="5" fill="#9aa5ce"/>
    <text x="18" y="0" class="label">C</text>
    <text x="205" y="0" class="muted" text-anchor="end">56,6 %</text>
  </g>
  <g transform="translate(250, 92)">
    <circle cx="5" cy="-5" r="5" fill="#f34b7d"/>
    <text x="18" y="0" class="label">C++</text>
    <text x="205" y="0" class="muted" text-anchor="end">27,1 %</text>
  </g>
  <g transform="translate(25, 118)">
    <circle cx="5" cy="-5" r="5" fill="#b07219"/>
    <text x="18" y="0" class="label">Java</text>
    <text x="205" y="0" class="muted" text-anchor="end">7,4 %</text>
  </g>
  <g transform="translate(250, 118)">
    <circle cx="5" cy="-5" r="5" fill="#663399"/>
    <text x="18" y="0" class="label">CSS</text>
    <text x="205" y="0" class="muted" text-anchor="end">1,6 %</text>
  </g>
  <g transform="translate(25, 144)">
    <circle cx="5" cy="-5" r="5" fill="#3178c6"/>
    <text x="18" y="0" class="label">TypeScript</text>
    <text x="205" y="0" class="muted" text-anchor="end">1,5 %</text>
  </g>
  <g transform="translate(250, 144)">
    <circle cx="5" cy="-5" r="5" fill="#f1e05a"/>
    <text x="18" y="0" class="label">JavaScript</text>
    <text x="205" y="0" class="muted" text-anchor="end">1,4 %</text>
  </g>
  <g transform="translate(25, 170)">
    <circle cx="5" cy="-5" r="5" fill="#565f89"/>
    <text x="18" y="0" class="label">Autres</text>
    <text x="205" y="0" class="muted" text-anchor="end">4,4 %</text>
  </g>
</svg>
